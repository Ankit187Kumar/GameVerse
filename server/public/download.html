<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Your AI Video</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0d0620;
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-6">
  <!-- Top bar -->
  <div class="text-center mt-6">
    <h1 class="text-2xl font-extrabold uppercase tracking-wider">
      📸 <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">AI Video Ready</span>
    </h1>
    <p class="text-xs text-slate-400 mt-1">Get your personalized animated memory</p>
  </div>

  <!-- Loading State -->
  <div id="loader" class="flex-1 flex flex-col items-center justify-center space-y-4 my-8">
    <svg class="animate-spin h-10 w-10 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <p class="text-sm text-slate-300">Fetching your amazing video...</p>
  </div>

  <!-- Main Content (Hidden until loaded) -->
  <div id="main-content" class="hidden flex-1 flex flex-col justify-center max-w-md mx-auto w-full my-6 space-y-6">
    <div class="bg-white/5 border border-white/10 rounded-3xl p-5 shadow-xl backdrop-blur-md">
      <p class="text-xs text-purple-400 font-bold uppercase tracking-wider">Congratulations</p>
      <h2 id="user-greeting" class="text-xl font-bold text-slate-100 mt-0.5">Hey Guest!</h2>
      <p class="text-xs text-slate-400 mt-1">Your photo-booth video was compiled successfully.</p>
      
      <!-- Video Player container -->
      <div class="aspect-[9/16] bg-black/40 rounded-2xl overflow-hidden border border-slate-800 my-4 flex items-center justify-center relative">
        <video id="video-player" class="w-full h-full object-cover" controls playsinline loop></video>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-3">
        <a id="btn-download" href="#" download class="w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-purple-900/40 transition active:scale-[0.98] flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download to Phone
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="text-center text-[10px] text-slate-500 mt-6 mb-2">
    Powered by Metaverse911 Holobox &bull; AI Photo Booth &copy; 2026
  </div>

  <!-- Page Logic -->
  <script>
    async function loadVideo() {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('id');

      if (!userId) {
        document.getElementById('loader').innerHTML = `
          <div class="text-center text-red-400 p-4">
            <p class="font-bold">Error</p>
            <p class="text-xs">No video ID was provided in the link.</p>
          </div>
        `;
        return;
      }

      try {
        const response = await fetch(`/api/users/${userId}`);
        if (!response.ok) throw new Error('User not found');
        const user = await response.json();

        // Update DOM
        document.getElementById('user-greeting').innerText = `Hey ${user.name || 'there'}!`;
        
        const videoPlayer = document.getElementById('video-player');
        const btnDownload = document.getElementById('btn-download');

        if (user.videoUrl) {
          videoPlayer.src = user.videoUrl;
          btnDownload.href = user.videoUrl;
          btnDownload.download = `photobooth_${userId}.mp4`;
        } else {
          // If video still generating or missing, show placeholder
          videoPlayer.src = user.photoUrl; // fall back to showing their photo
          btnDownload.classList.add('opacity-50', 'pointer-events-none');
          btnDownload.innerText = 'Video not ready yet';
        }

        // Transition views
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');

      } catch (err) {
        console.error(err);
        document.getElementById('loader').innerHTML = `
          <div class="text-center text-red-400 p-4">
            <p class="font-bold">Fetch Failed</p>
            <p class="text-xs">Could not load the details. Are you on the correct network?</p>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', loadVideo);
  </script>
</body>
</html>
